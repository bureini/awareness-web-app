<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Message Awareness · AI Draft</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #f0f4ff 0%, #d9e2f0 100%);
      padding: 20px;
    }

    .app-card {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 20, 50, 0.15), 0 8px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .app-header i {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #2a6df4, #1a4fbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0b1a33;
    }

    .app-header .badge {
      margin-left: auto;
      background: #eef3fe;
      color: #1a4fbf;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(42, 109, 244, 0.2);
    }

    .textarea-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 320px;
      padding: 18px 20px;
      font-size: 1rem;
      line-height: 1.7;
      border: 2px solid #e2eaf5;
      border-radius: 24px;
      background: #fafcff;
      resize: vertical;
      color: #0b1a33;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: border 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #2a6df4;
      box-shadow: 0 0 0 4px rgba(42, 109, 244, 0.12);
    }

    textarea::placeholder {
      color: #a0b8d0;
    }

    .char-counter {
      display: flex;
      justify-content: flex-end;
      font-size: 0.85rem;
      color: #7a94b0;
      margin-bottom: 18px;
      padding-right: 6px;
    }

    .char-counter.warning { color: #e67e22; }
    .char-counter.danger { color: #e74c3c; font-weight: 600; }

    .ai-controls {
      background: #f6f9ff;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 20px;
      border: 1px solid #e4ebf5;
    }

    .ai-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .ai-row select,
    .ai-row input {
      flex: 1 1 130px;
      padding: 10px 14px;
      border: 1.5px solid #dce4ef;
      border-radius: 40px;
      font-size: 0.9rem;
      background: white;
      color: #0b1a33;
      outline: none;
      transition: border 0.2s;
      min-width: 100px;
    }

    .ai-row select:focus,
    .ai-row input:focus {
      border-color: #2a6df4;
      box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.1);
    }

    .btn-ai {
      flex: 0 0 auto;
      padding: 10px 24px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #2a6df4, #1a4fbf);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(42, 109, 244, 0.25);
      white-space: nowrap;
    }

    .btn-ai:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(42, 109, 244, 0.35);
      background: linear-gradient(135deg, #3a7df4, #2a5fcf);
    }

    .btn-ai:active { transform: scale(0.96); }
    .btn-ai:disabled {
      opacity: 0.6;
      pointer-events: none;
      filter: grayscale(0.3);
    }

    .btn-ai .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-ai.loading .spinner { display: inline-block; }
    .btn-ai.loading .btn-text { display: none; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin: 18px 0 14px;
    }

    .btn-share {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 8px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #f2f6fd;
      color: #1f3a5f;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 72px;
      text-decoration: none;
      line-height: 1.2;
    }

    .btn-share i { font-size: 1.8rem; margin-bottom: 2px; }
    .btn-share:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); background: #e8effa; }
    .btn-share:active { transform: scale(0.96); }

    .btn-share.twitter { background: #e8f0fe; color: #1da1f2; }
    .btn-share.twitter:hover { background: #d4e8fa; }
    .btn-share.whatsapp { background: #e6f7ee; color: #25d366; }
    .btn-share.whatsapp:hover { background: #cff0dd; }
    .btn-share.facebook { background: #eaf0ff; color: #1877f2; }
    .btn-share.facebook:hover { background: #d6e4ff; }
    .btn-share.email { background: #f0f4fa; color: #6c7a8a; }
    .btn-share.email:hover { background: #e2e8f0; }
    .btn-share.copy { background: #f2f2f7; color: #2c3e50; }
    .btn-share.copy:hover { background: #e5e5ec; }

    .btn-share.share-native {
      background: linear-gradient(135deg, #2a6df4, #1a4fbf);
      color: white;
      box-shadow: 0 4px 12px rgba(42, 109, 244, 0.25);
      grid-column: 1 / -1;
      flex-direction: row;
      gap: 12px;
      min-height: 56px;
      padding: 12px;
    }

    .btn-share.share-native:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(42, 109, 244, 0.35);
      background: linear-gradient(135deg, #3a7df4, #2a5fcf);
    }

    .btn-share.share-native i { font-size: 1.4rem; margin-bottom: 0; }

    .footer-note {
      margin-top: 16px;
      text-align: center;
      font-size: 0.75rem;
      color: #8aa0b8;
      border-top: 1px solid #e8eef8;
      padding-top: 16px;
      letter-spacing: 0.2px;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0b1a33;
      color: white;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.35s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }

    .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 520px) {
      .app-card { padding: 20px 16px; }
      .app-header h1 { font-size: 1.4rem; }
      .ai-row { flex-direction: column; align-items: stretch; }
      .ai-row select, .ai-row input { flex: 1 1 auto; }
      .btn-ai { justify-content: center; }
      .action-grid { grid-template-columns: repeat(3, 1fr); }
      .btn-share.share-native { grid-column: 1 / -1; }
      textarea { height: 280px; }
    }

    @media (max-width: 380px) {
      .action-grid { grid-template-columns: repeat(2, 1fr); }
      .btn-share.share-native { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="app-header">
      <i class="fas fa-bullhorn"></i>
      <h1>Message Awareness</h1>
      <span class="badge">AI draft</span>
    </div>

    <div class="textarea-wrapper">
      <textarea id="messageInput" placeholder="Write your message… or let AI draft one for you."></textarea>
    </div>
    <div class="char-counter" id="charCounter">
      <span id="charCount">0</span> characters
    </div>

    <div class="ai-controls">
      <div class="ai-row">
        <select id="toneSelect">
          <option value="neutral">Neutral</option>
          <option value="professional">Professional</option>
          <option value="friendly">Friendly</option>
          <option value="urgent">Urgent</option>
          <option value="inspiring">Inspiring</option>
          <option value="concise">Concise</option>
        </select>
        <input type="text" id="topicInput" placeholder="Topic (optional, e.g., climate)" />
        <button id="aiAssistBtn" class="btn-ai">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-wand-magic-sparkles"></i> AI Assist</span>
        </button>
      </div>
    </div>

    <div class="action-grid">
      <button class="btn-share share-native" id="shareNativeBtn">
        <i class="fas fa-share-alt"></i><span>Share via…</span>
      </button>
      <button class="btn-share twitter" id="shareTwitter">
        <i class="fab fa-twitter"></i><span>Tweet</span>
      </button>
      <button class="btn-share whatsapp" id="shareWhatsApp">
        <i class="fab fa-whatsapp"></i><span>WhatsApp</span>
      </button>
      <button class="btn-share facebook" id="shareFacebook">
        <i class="fab fa-facebook-f"></i><span>Facebook</span>
      </button>
      <button class="btn-share email" id="shareEmail">
        <i class="fas fa-envelope"></i><span>Email</span>
      </button>
      <button class="btn-share copy" id="copyBtn">
        <i class="fas fa-copy"></i><span>Copy</span>
      </button>
    </div>

    <div class="footer-note">
      <i class="fas fa-robot" style="margin-right: 6px;"></i> AI helps you draft — then share with the world.
    </div>
  </div>

  <div id="toast" class="toast-message"></div>

  <script>
    (function() {
      // ─── 🔐 API key is injected at build time from GitHub Secrets ───
      // The placeholder __GROQ_API_KEY__ is replaced during deployment.
      const GROQ_API_KEY = '__GROQ_API_KEY__';

      // ─── DOM refs ───
      const textarea = document.getElementById('messageInput');
      const charCount = document.getElementById('charCount');
      const charCounter = document.getElementById('charCounter');
      const toneSelect = document.getElementById('toneSelect');
      const topicInput = document.getElementById('topicInput');
      const aiBtn = document.getElementById('aiAssistBtn');

      // ─── Counter ───
      function updateCounter() {
        const len = textarea.value.length;
        charCount.textContent = len;
        charCounter.classList.remove('warning', 'danger');
        if (len > 280) charCounter.classList.add('warning');
        if (len > 500) charCounter.classList.add('danger');
      }
      textarea.addEventListener('input', updateCounter);
      updateCounter();

      // ─── Toast ───
      let toastTimer = null;
      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      // ─── REAL AI Assist (Groq) ───
      aiBtn.addEventListener('click', async function() {
        const originalText = textarea.value;
        const tone = toneSelect.value;
        const topic = topicInput.value;

        if (!originalText.trim() && !topic.trim()) {
          showToast('✏️ Please write a draft or enter a topic.');
          return;
        }

        aiBtn.classList.add('loading');
        aiBtn.disabled = true;
        //check this 
        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${GROQ_API_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              messages: [
                {
                  role: 'system',
                  content: `Rewrite the user's message in a ${tone} tone. ${topic ? `The topic is about ${topic}.` : ''} Return ONLY the rewritten message. Do not add quotes, labels, or explanations.`
                },
                {
                  role: 'user',
                  content: originalText || `Write a short awareness message about ${topic}`
                }
              ],
              temperature: 0.8,
              max_tokens: 300
            })
          });

          const data = await response.json();

          if (data.error) {
            showToast('⚠️ API Error: ' + data.error.message);
            return;
          }

          const newText = data.choices?.[0]?.message?.content || originalText;
          textarea.value = newText;
          updateCounter();
          showToast('✨ Real AI rewrite complete!');

        } catch (error) {
          console.error(error);
          showToast('⚠️ Could not reach AI. Check your internet.');
        } finally {
          aiBtn.classList.remove('loading');
          aiBtn.disabled = false;
        }
      });

      // ─── Share / Copy functions ───
      function getValidMessage() {
        const msg = textarea.value.trim();
        if (!msg) {
          showToast('✏️ Please write a message first.');
          return null;
        }
        return msg;
      }

      document.getElementById('shareNativeBtn').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        if (navigator.share) {
          navigator.share({ title: 'Message Awareness', text: msg })
            .catch(err => { if (err.name !== 'AbortError') showToast('⚠️ Share cancelled.'); });
        } else {
          showToast('📱 Web Share not supported. Use other buttons.');
        }
      });

      document.getElementById('shareTwitter').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(msg)}`, '_blank', 'width=600,height=400');
      });

      document.getElementById('shareWhatsApp').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
      });

      document.getElementById('shareFacebook').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        const url = window.location.href;
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(msg)}`, '_blank', 'width=600,height=400');
      });

      document.getElementById('shareEmail').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        window.location.href = `mailto:?subject=${encodeURIComponent('Check out this message')}&body=${encodeURIComponent(msg)}`;
      });

      document.getElementById('copyBtn').addEventListener('click', function() {
        const msg = getValidMessage();
        if (!msg) return;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(msg).then(() => showToast('✅ Copied!'))
            .catch(() => fallbackCopy(msg));
        } else {
          fallbackCopy(msg);
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('✅ Copied!');
        } catch (e) {
          showToast('❌ Copy failed. Select manually.');
        }
        document.body.removeChild(ta);
      }

      textarea.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          aiBtn.click();
        }
      });

    })();
  </script>
</body>
</html>
